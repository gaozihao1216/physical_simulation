[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-simulation"
version = "0.1.0"
description = "Physical simulation authoring and evaluation project skeleton."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]
mujoco = [
    "mujoco>=3",
]

[tool.setuptools.packages.find]
where = ["src"]
